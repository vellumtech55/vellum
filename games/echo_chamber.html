<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Echo Chamber — Vellum Studio</title>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #161616;
    --panel-line: #262626;
    --accent: #2f7dd6;
    --accent-dim: #1c4c85;
    --goal: #35c98d;
    --text: #e8e8e8;
    --text-dim: #8a8a8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #wrap { display: flex; height: 100vh; width: 100vw; }
  #hud {
    width: 220px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--panel-line);
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #hud h1 { font-size: 15px; letter-spacing: 2px; margin: 0; color: var(--accent); font-weight: 700; }
  #hud .sub { font-size: 11px; color: var(--text-dim); margin-top: -10px; letter-spacing: 1px; }
  .stat { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--panel-line); padding-bottom: 8px; }
  .stat b { color: var(--text); font-size: 14px; }
  button {
    background: var(--accent-dim); color: var(--text); border: 1px solid var(--accent);
    padding: 9px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
    letter-spacing: 0.5px; font-weight: 600; transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: var(--accent); }
  button:active { transform: scale(0.97); }
  button.secondary { background: transparent; border-color: var(--panel-line); color: var(--text-dim); }
  button.secondary:hover { border-color: var(--text-dim); background: #1d1d1d; }
  #compassWrap { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--panel-line); }
  #compassWrap .label { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
  #compassArrow { font-size: 22px; color: var(--goal); transition: transform 0.15s linear; }
  #chargesBar { display: flex; gap: 4px; }
  .charge { width: 16px; height: 6px; background: var(--panel-line); border-radius: 2px; }
  .charge.filled { background: var(--accent); }
  #instructions { font-size: 11px; line-height: 1.6; color: var(--text-dim); }
  #instructions b { color: var(--text); }
  #stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; border: 1px solid var(--panel-line); }
  #banner {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(13,13,13,0.94); border: 1px solid var(--panel-line); border-radius: 8px;
    padding: 28px 36px; text-align: center; display: none; flex-direction: column; gap: 12px;
    align-items: center; min-width: 260px;
  }
  #banner h2 { margin: 0; font-size: 20px; letter-spacing: 1px; color: var(--goal); }
  #banner p { margin: 0; color: var(--text-dim); font-size: 13px; }
  #footer-note { font-size: 10px; color: #4a4a4a; margin-top: auto; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>
      <h1>ECHO CHAMBER</h1>
      <div class="sub">a Vellum original</div>
    </div>

    <div class="stat">Depth <b id="levelNum">1</b></div>
    <div class="stat">Time <b id="timeVal">0.0s</b></div>
    <div class="stat">Best <b id="bestVal">—</b></div>

    <div id="compassWrap">
      <div class="label">EXIT BEARING</div>
      <div id="compassArrow">&#8593;</div>
    </div>

    <div>
      <div class="stat" style="border-bottom:none; padding-bottom:4px;">Sonar <b id="chargeCount">5/5</b></div>
      <div id="chargesBar"></div>
    </div>

    <button id="resetBtn" class="secondary">Reset Depth</button>

    <div id="instructions">
      Move with <b>WASD</b> or arrow keys. Press <b>Space</b> or click the maze to ping — it lights nearby walls for a moment. Find the glowing gate before your bearings run out of patience.
    </div>

    <div id="footer-note">ECHO CHAMBER · vellum studio</div>
  </div>

  <div id="stage">
    <canvas id="game" width="720" height="540"></canvas>
    <div id="banner">
      <h2 id="bannerTitle">Gate Found</h2>
      <p id="bannerText"></p>
      <button id="bannerNext">Descend →</button>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const levelConfigs = [
    { n: 9,  seed: 1337,  charges: 6, radius: 3.4, regen: 3200 },
    { n: 12, seed: 4242,  charges: 6, radius: 3.2, regen: 3200 },
    { n: 15, seed: 909,   charges: 7, radius: 3.0, regen: 3000 },
    { n: 18, seed: 55555, charges: 7, radius: 2.8, regen: 2800 },
    { n: 22, seed: 8842,  charges: 8, radius: 2.7, regen: 2600 }
  ];

  let levelIdx = 0;
  let maze, n, cellSize, offX, offY;
  let player = { cx: 0, cy: 0, px: 0, py: 0, moving: false, fromX:0, fromY:0, toX:0, toY:0, t:0 };
  let goalCell;
  let revealed = new Map(); // "x,y,dir" -> timestamp
  let charges, maxCharges, radius, regenMs;
  let lastRegen = 0;
  let startTime = 0;
  let elapsed = 0;
  let finished = false;
  let bestTimes = {};
  let keysDown = {};
  const FADE_MS = 3600;
  const AMBIENT_R = 1.35;
  let ripples = []; // {x,y,t}

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function buildMaze(size, seed){
    const rand = mulberry32(seed);
    const cells = [];
    for (let x=0;x<size;x++){
      cells.push([]);
      for (let y=0;y<size;y++){
        cells[x].push({ N:true, E:true, S:true, W:true, visited:false });
      }
    }
    const dirs = [
      {k:'N', dx:0, dy:-1, o:'S'},
      {k:'E', dx:1, dy:0,  o:'W'},
      {k:'S', dx:0, dy:1,  o:'N'},
      {k:'W', dx:-1,dy:0,  o:'E'}
    ];
    const stack = [[0,0]];
    cells[0][0].visited = true;
    while (stack.length){
      const [x,y] = stack[stack.length-1];
      const opts = [];
      for (const d of dirs){
        const nx = x+d.dx, ny = y+d.dy;
        if (nx>=0 && ny>=0 && nx<size && ny<size && !cells[nx][ny].visited){
          opts.push({d, nx, ny});
        }
      }
      if (opts.length){
        const pick = opts[Math.floor(rand()*opts.length)];
        cells[x][y][pick.d.k] = false;
        cells[pick.nx][pick.ny][pick.d.o] = false;
        cells[pick.nx][pick.ny].visited = true;
        stack.push([pick.nx, pick.ny]);
      } else {
        stack.pop();
      }
    }
    return cells;
  }

  function loadLevel(idx){
    const cfg = levelConfigs[idx];
    n = cfg.n;
    maze = buildMaze(n, cfg.seed);
    cellSize = Math.floor(Math.min(660/n, 480/n));
    offX = (W - cellSize*n)/2;
    offY = (H - cellSize*n)/2;
    goalCell = { x: n-1, y: n-1 };
    player = { cx:0, cy:0, px:0, py:0, moving:false, fromX:0, fromY:0, toX:0, toY:0, t:0 };
    revealed = new Map();
    ripples = [];
    charges = cfg.charges;
    maxCharges = cfg.charges;
    radius = cfg.radius;
    regenMs = cfg.regen;
    lastRegen = performance.now();
    startTime = performance.now();
    elapsed = 0;
    finished = false;
    document.getElementById('banner').style.display = 'none';
    updateHud();
    renderCharges();
  }

  function cellCenterPx(cx, cy){
    return { x: offX + (cx+0.5)*cellSize, y: offY + (cy+0.5)*cellSize };
  }

  function ping(){
    if (finished || charges <= 0) return;
    charges--;
    const now = performance.now();
    const cpx = cellCenterPx(player.cx, player.cy);
    ripples.push({ x: cpx.x, y: cpx.y, t: now });
    for (let x=0;x<n;x++){
      for (let y=0;y<n;y++){
        const dist = Math.hypot(x-player.cx, y-player.cy);
        if (dist <= radius){
          const c = maze[x][y];
          if (c.N) revealed.set(`${x},${y},N`, now);
          if (c.S) revealed.set(`${x},${y},S`, now);
          if (c.E) revealed.set(`${x},${y},E`, now);
          if (c.W) revealed.set(`${x},${y},W`, now);
        }
      }
    }
    renderCharges();
  }

  function renderCharges(){
    const bar = document.getElementById('chargesBar');
    bar.innerHTML = '';
    for (let i=0;i<maxCharges;i++){
      const d = document.createElement('div');
      d.className = 'charge' + (i < charges ? ' filled' : '');
      bar.appendChild(d);
    }
    document.getElementById('chargeCount').textContent = `${charges}/${maxCharges}`;
  }

  function updateHud(){
    document.getElementById('levelNum').textContent = levelIdx+1;
    document.getElementById('bestVal').textContent = bestTimes[levelIdx] !== undefined ? bestTimes[levelIdx].toFixed(1)+'s' : '—';
  }

  function tryMove(dx, dy){
    if (player.moving || finished) return;
    const c = maze[player.cx][player.cy];
    let dirKey = null;
    if (dx===1) dirKey='E'; else if (dx===-1) dirKey='W'; else if (dy===1) dirKey='S'; else if (dy===-1) dirKey='N';
    if (!dirKey) return;
    if (c[dirKey]) return; // wall blocks
    const nx = player.cx+dx, ny = player.cy+dy;
    if (nx<0||ny<0||nx>=n||ny>=n) return;
    const from = cellCenterPx(player.cx, player.cy);
    const to = cellCenterPx(nx, ny);
    player.moving = true;
    player.fromX = from.x; player.fromY = from.y;
    player.toX = to.x; player.toY = to.y;
    player.t = 0;
    player.cx = nx; player.cy = ny;
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup','w'].includes(k)) tryMove(0,-1);
    else if (['arrowdown','s'].includes(k)) tryMove(0,1);
    else if (['arrowleft','a'].includes(k)) tryMove(-1,0);
    else if (['arrowright','d'].includes(k)) tryMove(1,0);
    else if (k===' '){ e.preventDefault(); ping(); }
  });
  canvas.addEventListener('click', ping);

  document.getElementById('resetBtn').addEventListener('click', () => loadLevel(levelIdx));
  document.getElementById('bannerNext').addEventListener('click', () => {
    levelIdx = (levelIdx+1) % levelConfigs.length;
    loadLevel(levelIdx);
  });

  function drawWallSeg(x, y, dir){
    const x0 = offX + x*cellSize, y0 = offY + y*cellSize;
    ctx.beginPath();
    if (dir==='N'){ ctx.moveTo(x0,y0); ctx.lineTo(x0+cellSize,y0); }
    else if (dir==='S'){ ctx.moveTo(x0,y0+cellSize); ctx.lineTo(x0+cellSize,y0+cellSize); }
    else if (dir==='W'){ ctx.moveTo(x0,y0); ctx.lineTo(x0,y0+cellSize); }
    else if (dir==='E'){ ctx.moveTo(x0+cellSize,y0); ctx.lineTo(x0+cellSize,y0+cellSize); }
    ctx.stroke();
  }

  function draw(now){
    ctx.clearRect(0,0,W,H);

    // ambient reveal around player (always-on faint radius) + timed reveals
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';

    // draw goal glow (only if within a generous sensing range, else very faint hint)
    const gpx = cellCenterPx(goalCell.x, goalCell.y);
    const distToGoal = Math.hypot(player.cx-goalCell.x, player.cy-goalCell.y);
    const goalVisible = distToGoal <= radius + 1;
    const pulse = 3*Math.sin(now/300);
    ctx.save();
    const galpha = goalVisible ? 0.85 : 0.12;
    const grad = ctx.createRadialGradient(gpx.x,gpx.y,0,gpx.x,gpx.y,cellSize*0.9+pulse);
    grad.addColorStop(0, `rgba(53,201,141,${galpha*0.6})`);
    grad.addColorStop(1, 'rgba(53,201,141,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(gpx.x,gpx.y,cellSize*0.9+pulse,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(53,201,141,${galpha})`;
    ctx.beginPath(); ctx.arc(gpx.x,gpx.y,5,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // walls: ambient radius
    for (let x=0;x<n;x++){
      for (let y=0;y<n;y++){
        const dist = Math.hypot(x-player.cx, y-player.cy);
        const c = maze[x][y];
        const ambient = dist <= AMBIENT_R;
        for (const dir of ['N','S','E','W']){
          if (!c[dir]) continue;
          const key = `${x},${y},${dir}`;
          const ts = revealed.get(key);
          let alpha = 0;
          if (ambient) alpha = Math.max(alpha, 0.85);
          if (ts !== undefined){
            const age = now - ts;
            if (age < FADE_MS) alpha = Math.max(alpha, (1 - age/FADE_MS) * 0.85);
          }
          if (alpha > 0.01){
            ctx.strokeStyle = `rgba(47,125,214,${alpha})`;
            drawWallSeg(x,y,dir);
          }
        }
      }
    }

    // ripples
    for (let i=ripples.length-1;i>=0;i--){
      const r = ripples[i];
      const age = now - r.t;
      const dur = 900;
      if (age > dur){ ripples.splice(i,1); continue; }
      const prog = age/dur;
      ctx.strokeStyle = `rgba(47,125,214,${(1-prog)*0.5})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, prog*radius*cellSize, 0, Math.PI*2);
      ctx.stroke();
    }

    // player movement interpolation
    if (player.moving){
      player.t += 1/9;
      if (player.t >= 1){
        player.t = 1;
        player.moving = false;
      }
      const ease = 1 - Math.pow(1-player.t, 2);
      player.px = player.fromX + (player.toX-player.fromX)*ease;
      player.py = player.fromY + (player.toY-player.fromY)*ease;
    } else {
      const c = cellCenterPx(player.cx, player.cy);
      player.px = c.x; player.py = c.y;
    }

    ctx.fillStyle = '#e8e8e8';
    ctx.beginPath(); ctx.arc(player.px, player.py, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(232,232,232,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(player.px, player.py, 10, 0, Math.PI*2); ctx.stroke();

    // check win
    if (!finished && player.cx === goalCell.x && player.cy === goalCell.y && !player.moving){
      finished = true;
      elapsed = (now - startTime)/1000;
      if (bestTimes[levelIdx] === undefined || elapsed < bestTimes[levelIdx]) bestTimes[levelIdx] = elapsed;
      document.getElementById('bannerTitle').textContent = 'Gate Found';
      document.getElementById('bannerText').textContent = `Reached in ${elapsed.toFixed(1)}s using ${maxCharges-charges} pings.`;
      document.getElementById('banner').style.display = 'flex';
      updateHud();
    }

    // regen charges
    if (charges < maxCharges && now - lastRegen > regenMs){
      charges++;
      lastRegen = now;
      renderCharges();
    }

    // timer + compass
    if (!finished){
      elapsed = (now - startTime)/1000;
    }
    document.getElementById('timeVal').textContent = elapsed.toFixed(1)+'s';
    const angle = Math.atan2(goalCell.y-player.cy, goalCell.x-player.cx) * 180/Math.PI + 90;
    document.getElementById('compassArrow').style.transform = `rotate(${angle}deg)`;

    requestAnimationFrame(draw);
  }

  loadLevel(0);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
